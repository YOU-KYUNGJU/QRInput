[system]
app_name=QRinputUnified
fiti_exe_path=C:\fiti\fiti.exe
login_window_title=시험관리시스템 로그인
main_window_title=Fiti
qr_window_title=QR스캔
fiti_process_name=fiti.exe
max_relogin_count=3
max_row_retry_count=3
close_existing_fiti_before_run=true
close_fiti_after_team_run=true
keep_source_csv=true
use_lock_file=true
lock_file_path=.\runtime\qrinput.lock
history_dir=.\logs\history
run_log_dir=.\logs\runs
debug_log_enabled=true
debug_log_dir=.\logs\debug
success_screenshot_enabled=true
; when false, success rows with reason=already_checked do not create a screenshot file.
already_checked_success_screenshot_enabled=false
failure_screenshot_enabled=true
default_wait_timeout_ms=7000
default_poll_interval_ms=200
wait_login_timeout_ms=12000
wait_main_timeout_ms=12000
wait_qr_window_timeout_ms=8000
wait_save_timeout_ms=5000

[ui]
main_window_x=200
main_window_y=0
main_window_w=1300
main_window_h=1000
dpi_scale=100
login_user_control=ThunderRT6TextBox1
login_password_control=ThunderRT6TextBox2
login_submit_button=Button1
dialog_confirm_button=Button1
dialog_post_confirm_delay_ms=500
dialog_post_confirm_keys=
login_post_submit_keys=
qr_button_x=730
qr_button_y=85
qr_button_click_count=10
qr_button_wait_ms=1000
qr_verify_controls=ThunderRT6TextBox2|ThunderRT6TextBox3|ThunderRT6TextBox4|ThunderRT6TextBox5
checkbox_pixel_x=825
checkbox_pixel_y=171
checkbox_checked_color=0xFF0000
checkbox_unchecked_color=0xC0C0C0
checkbox_control=Button6
save_control=Button2
post_save_control=Button8
save_result_pixel_x=725
save_result_pixel_y=171
save_result_color=0xC0C0C0
save_result_pending_color=0xFFFFFF

[team.analysis]
enabled=true
team_name=분석화학평가팀
part_name=pH/폼알데하이드
login_id=
login_password=
csv_root_path=
receipt_mode=compose
receipt_compose_columns=A,D,B
receipt_direct_column=
row_scan_column=A
row_scan_pattern=^[A-Z][0-9]{3}$
stop_file_on_empty_scan_column=false
skip_today_success_receipt=true
cutoff_hour=14
allow_future_folder=true
recent_date_folder_count=1
file_select_policy=all_csv_in_target_folder
file_created_after_hour=
previous_date_scan_before_hour=
previous_date_created_after_hour=
postprocess_mode=keep
failure_policy=continue
stop_on_check_failure=false
move_processed_file=false
processed_file_dir=
log_dir=.\logs\analysis
; screenshot_dir may be a local cache root or a file-server root. Runtime appends \yyyy\MM\yyyyMMdd automatically.
screenshot_dir=\\192.168.1.7\유해물질시험팀\3. 폼알데히드,pH파트\자동화프로그램 개발\logs\analysis
; screenshot_sync_dir is optional when screenshot_dir already points to the file server.
screenshot_sync_dir=

